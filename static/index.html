<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Butler // Life OS</title>
<style>
:root{--bg:#070b12;--panel:#0e1624;--panel2:#0a101d;--border:#1e2d4a;--cyan:#38bdf8;--emerald:#10b981;--amber:#f59e0b;--text:#e2e8f0;--muted:#94a3b8}
*{box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:54px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.topbar h1{font-size:14px;color:var(--cyan);letter-spacing:.08em}
.topbar .meta{font-size:12px;color:var(--muted)}
.main{flex:1;display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;overflow:hidden}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;overflow-y:auto}
.panel::-webkit-scrollbar{width:6px}.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
h3{font-size:12px;color:var(--cyan);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.card .title{font-weight:700;font-size:13px;margin-bottom:4px}
.card .sub{font-size:11px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
.badge.t1{background:rgba(244,63,94,.15);color:#f43f5e}
.badge.t2{background:rgba(245,158,11,.15);color:#f59e0b}
.badge.t3{background:rgba(16,185,129,.15);color:#10b981}
.chat-panel{display:flex;flex-direction:column}
.chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5;max-width:85%;word-wrap:break-word}
.msg.user{background:#16243d;align-self:flex-end;border-right:3px solid var(--emerald)}
.msg.jarvis{background:var(--panel2);align-self:flex-start;border-left:3px solid var(--cyan)}
.msg.system{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);color:var(--amber);font-size:11px;align-self:center}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px}
.chat-input button{background:var(--cyan);color:var(--bg);border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
.voice-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#1e293b,#0f172a);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.orb.listening{background:radial-gradient(circle,#10b981,#059669);border-color:var(--emerald);box-shadow:0 0 20px rgba(16,185,129,.5)}
.orb.speaking{background:radial-gradient(circle,#38bdf8,#0284c7);border-color:var(--cyan);box-shadow:0 0 20px rgba(56,189,248,.5)}
.status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px}
.status-pill.online{background:rgba(16,185,129,.15);color:var(--emerald)}
.status-pill.offline{background:rgba(244,63,94,.15);color:#f43f5e}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase}
</style>
</head>
<body>
<div class="topbar">
  <h1>BUTLER // LIFE OS</h1>
  <div class="meta"><span id="clock">--:--</span> • <span id="stateLabel">Loading...</span></div>
</div>
<div class="main">
  <div style="display:flex;flex-direction:column;gap:16px;overflow-y:auto">
    <div class="panel"><h3>Grade Margins</h3><div id="gradesTable"></div></div>
    <div class="panel"><h3>Pending Tasks</h3><div id="tasksList"></div></div>
    <div class="panel"><h3>Today's Schedule</h3><div id="scheduleList"></div></div>
  </div>
  <div class="panel chat-panel">
    <div class="voice-bar">
      <div id="voiceOrb" class="orb" onclick="toggleMic()">🎤</div>
      <div><div id="connPill" class="status-pill offline">OFFLINE</div><div style="font-size:11px;color:var(--muted);margin-top:4px" id="connMsg">Click orb to start voice</div></div>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <div class="chat-input">
      <input id="textInput" placeholder="Ask Butler anything..." onkeydown="if(event.key==='Enter')sendText()">
      <button onclick="sendText()">Send</button>
    </div>
  </div>
</div>
<script>
let ws=null,micActive=false,micStream=null,audioCtx=null,processor=null,playbackCtx=null,nextPlayTime=0,isSpeaking=false;

async function loadState(){
  const res=await fetch('/api/state');
  const s=await res.json();
  document.getElementById('clock').textContent=s.timestamp_pkt;
  document.getElementById('stateLabel').textContent=`${s.profile?.name||''} | ${s.working_state.location} | E:${s.working_state.energy}/5`;
  // Grades
  let gt='<table><tr><th>Course</th><th>Obtained</th><th>Projected</th><th>Grade</th></tr>';
  (s.grade_margins||[]).forEach(g=>{gt+=`<tr><td><b>${g.code}</b></td><td>${g.obtained_sum}/${g.max_so_far}</td><td>${g.projected_pct}%</td><td><b>${g.projected_grade}</b></td></tr>`});
  document.getElementById('gradesTable').innerHTML=gt+'</table>';
  // Tasks
  let tl='';
  (s.pending_tasks||[]).forEach(t=>{tl+=`<div class="card"><div class="title">[${t.course_code||'GEN'}] ${t.title}</div><div class="sub">${t.assigned_day} ${t.assigned_window} @ ${t.assigned_location}</div></div>`});
  document.getElementById('tasksList').innerHTML=tl||'<div class="sub">All clear!</div>';
  // Schedule
  let sl='';
  (s.today_blocks||[]).forEach(b=>{sl+=`<div class="card"><div class="title">${b.start_time}-${b.end_time} [${b.type}]</div><div class="sub">${b.location||''} ${b.guardrail?'• '+b.guardrail:''}</div></div>`});
  document.getElementById('scheduleList').innerHTML=sl||'<div class="sub">Open day</div>';
}

function addMsg(role,text){
  const log=document.getElementById('chatLog');
  const div=document.createElement('div');
  div.className=`msg ${role}`;
  div.textContent=text;
  log.appendChild(div);
  log.scrollTop=log.scrollHeight;
}

function connectWS(){
  if(ws&&ws.readyState===WebSocket.OPEN)return;
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/live`);
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{
    document.getElementById('connPill').className='status-pill online';
    document.getElementById('connPill').textContent='ONLINE';
    document.getElementById('connMsg').textContent='Connected to Gemini Live';
  };
  ws.onmessage=async(e)=>{
    if(e.data instanceof ArrayBuffer){playAudio(e.data);return}
    const d=JSON.parse(e.data);
    if(d.type==='transcript')addMsg(d.role,d.text);
    if(d.type==='turn_complete')document.getElementById('voiceOrb').className='orb';
    if(d.type==='status'){document.getElementById('connMsg').textContent=d.message;loadState();}
    if(d.type==='state_update')loadState();
    if(d.type==='error')addMsg('system',d.message);
  };
  ws.onclose=()=>{
    document.getElementById('connPill').className='status-pill offline';
    document.getElementById('connPill').textContent='OFFLINE';
    document.getElementById('connMsg').textContent='Disconnected — click orb to reconnect';
  };
}

async function sendText(){
  const inp=document.getElementById('textInput');
  const txt=inp.value.trim();
  if(!txt)return;
  inp.value='';
  addMsg('user',txt);
  connectWS();
  if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'text',content:txt}));
  else setTimeout(()=>{if(ws)ws.send(JSON.stringify({type:'text',content:txt}))},500);
}

async function toggleMic(){
  if(micActive){
    micActive=false;
    document.getElementById('voiceOrb').className='orb';
    if(processor)processor.disconnect();
    if(micStream)micStream.getTracks().forEach(t=>t.stop());
    if(audioCtx)audioCtx.close();
    return;
  }
  connectWS();
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    audioCtx=new AudioContext();
    if(audioCtx.state==='suspended')await audioCtx.resume();
    const source=audioCtx.createMediaStreamSource(micStream);
    processor=audioCtx.createScriptProcessor(4096,1,1);
    const sink=audioCtx.createGain();sink.gain.value=0;
    const ratio=audioCtx.sampleRate/16000;
    processor.onaudioprocess=e=>{
      if(!micActive||isSpeaking)return;
      const input=e.inputBuffer.getChannelData(0);
      if(!ws||ws.readyState!==WebSocket.OPEN)return;
      const outLen=Math.floor(input.length/ratio);
      const pcm=new Int16Array(outLen);
      for(let i=0;i<outLen;i++){
        const s=Math.max(-1,Math.min(1,input[Math.floor(i*ratio)]));
        pcm[i]=s<0?s*0x8000:s*0x7FFF;
      }
      ws.send(pcm.buffer);
    };
    source.connect(processor);processor.connect(sink);sink.connect(audioCtx.destination);
    micActive=true;
    document.getElementById('voiceOrb').className='orb listening';
    document.getElementById('connMsg').textContent='Listening...';
  }catch(err){addMsg('system','Mic error: '+err.message)}
}

function playAudio(buf){
  if(!playbackCtx){playbackCtx=new AudioContext({sampleRate:24000});nextPlayTime=playbackCtx.currentTime+0.14}
  if(playbackCtx.state==='suspended')playbackCtx.resume();
  const int16=new Int16Array(buf);
  const float32=new Float32Array(int16.length);
  for(let i=0;i<int16.length;i++)float32[i]=int16[i]/32768;
  const audioBuf=playbackCtx.createBuffer(1,float32.length,24000);
  audioBuf.getChannelData(0).set(float32);
  const src=playbackCtx.createBufferSource();
  src.buffer=audioBuf;src.connect(playbackCtx.destination);
  if(nextPlayTime<playbackCtx.currentTime)nextPlayTime=playbackCtx.currentTime+0.14;
  src.start(nextPlayTime);
  nextPlayTime+=audioBuf.duration;
  isSpeaking=true;
  document.getElementById('voiceOrb').className='orb speaking';
  setTimeout(()=>{isSpeaking=false;if(micActive)document.getElementById('voiceOrb').className='orb listening'},(nextPlayTime-playbackCtx.currentTime)*1000+300);
}

loadState();
setInterval(loadState,30000);
</script>
</body>
</html>
